<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Stories Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="13" fill="#1a73e8"/>
          <path d="M8 14.5c0-3.31 2.69-6 6-6s6 2.69 6 6-2.69 6-6 6-6-2.69-6-6z" fill="white" opacity="0.3"/>
          <path d="M11 12l3 3 3-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11 16l3 3 3-3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
        </svg>
        <span>AI Stories Tracker</span>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="8" stroke="#5f6368" stroke-width="2"/>
            <path d="M21 21l-4.35-4.35" stroke="#5f6368" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search AI stories..." />
        </div>
        <button id="refreshBtn" class="btn-refresh" title="Refresh stories">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M23 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M1 20v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Sources</div>
        <div class="source-list" id="sourceList">
          <button class="source-btn active" data-source="all">
            <span class="source-dot" style="background:#1a73e8"></span>
            All Sources
          </button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Stats</div>
        <div id="statsPanel" class="stats-panel">
          <div class="stat-row"><span class="stat-label">Total Stories</span><span class="stat-val" id="totalCount">—</span></div>
          <div class="stat-row"><span class="stat-label">Last Updated</span><span class="stat-val" id="lastUpdated">—</span></div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Trending Topics</div>
        <div class="topics" id="topicsList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="results-info" id="resultsInfo"></div>
        <div class="sort-wrap">
          <label for="sortSelect">Sort:</label>
          <select id="sortSelect">
            <option value="newest">Newest First</option>
            <option value="source">By Source</option>
          </select>
        </div>
      </div>

      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching AI stories from across the web…</p>
      </div>

      <div id="errorState" class="error-state" style="display:none">
        <p>⚠️ Could not load stories. Make sure the server is running.</p>
        <button class="btn-primary" onclick="loadStories()">Try Again</button>
      </div>

      <div id="storiesGrid" class="stories-grid" style="display:none"></div>

      <div id="pagination" class="pagination" style="display:none">
        <button id="prevPage" class="btn-page">← Previous</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextPage" class="btn-page">Next →</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
